                 touch_1200: true }

  - id: avr-atmega328p-usbasp
    name: ATmega328P genérico (programador USBasp)
    family: AVR (ATmega328P, ISP)
    group: Arduino / AVR
    methods:
      avrdude: { part: atmega328p, programmer: usbasp, flash_kb: 32, bootloader_kb: 0 }

# =============================================================================
# STM32: catálogo por familias. Agregar un STM32 = UNA línea en "stm32:" con
#   id, name, family, dev_id (DBGMCU_IDCODE & 0xFFF, del manual de referencia) y flash_kb.
# Lo común de la familia está en "stm32_families:" y la línea lo puede pisar
# (dfu, interface, adapter_speed_khz, uid, flash_banks, tcl_vars, sector_kb).
# Antes de grabar se lee el ID del chip conectado: si no coincide, no se toca la flash
# y el banco dice qué chip es.
#
# interface: stlink-dap (lo que usa STM32CubeIDE): ST-Link V2-1 y V3, y V2 con firmware
# J24 o más nuevo (se actualiza con STM32CubeProgrammer). Para un V2 viejo, elegí "stlink"
# en Opciones avanzadas.
# dfu: el bootloader de ST tiene USB DFU (0483:df11) en esa familia o en ese chip.
# =============================================================================
stm32_families:
  C0:  { core: Cortex-M0+, target_cfg: target/stm32c0x.cfg, idcode_address: 0x40015800, uid: 0x1FFF7550, interface: stlink-dap }
  F0:  { core: Cortex-M0, target_cfg: target/stm32f0x.cfg, idcode_address: 0x40015800, uid: 0x1FFFF7AC, interface: stlink-dap }
  F1:  { core: Cortex-M3, target_cfg: target/stm32f1x.cfg, idcode_address: 0xE0042000, uid: 0x1FFFF7E8, interface: stlink-dap, adapter_speed_khz: 1000 }
  F2:  { core: Cortex-M3, target_cfg: target/stm32f2x.cfg, idcode_address: 0xE0042000, uid: 0x1FFF7A10, interface: stlink-dap, dfu: true }
  F3:  { core: Cortex-M4, target_cfg: target/stm32f3x.cfg, idcode_address: 0xE0042000, uid: 0x1FFFF7AC, interface: stlink-dap }
  F4:  { core: Cortex-M4, target_cfg: target/stm32f4x.cfg, idcode_address: 0xE0042000, uid: 0x1FFF7A10, interface: stlink-dap, adapter_speed_khz: 2000, dfu: true }
  F7:  { core: Cortex-M7, target_cfg: target/stm32f7x.cfg, idcode_address: 0xE0042000, uid: 0x1FF0F420, interface: stlink-dap, dfu: true }
  G0:  { core: Cortex-M0+, target_cfg: target/stm32g0x.cfg, idcode_address: 0x40015800, uid: 0x1FFF7590, interface: stlink-dap }
  G4:  { core: Cortex-M4, target_cfg: target/stm32g4x.cfg, idcode_address: 0xE0042000, uid: 0x1FFF7590, interface: stlink-dap, dfu: true }
  # H5: la CPU está en el AP 1 (sólo stlink-dap).
  H5:  { core: Cortex-M33, target_cfg: target/stm32h5x.cfg, idcode_address: 0x44024000, uid: 0x08FFF800, interface: stlink-dap, dfu: true }
  # H7: el stm32h7x.cfg de ST elige el núcleo con AP_NUM (0 = Cortex-M7).
  H7:  { core: Cortex-M7, target_cfg: target/stm32h7x.cfg, idcode_address: 0x5C001000, uid: 0x1FF1E800, interface: stlink-dap, dfu: true, tcl_vars: { AP_NUM: 0 } }
  L0:  { core: Cortex-M0+, target_cfg: target/stm32l0x.cfg, idcode_address: 0x40015800, uid: 0x1FF80050, interface: stlink-dap }
  # L1: la dirección del número de serie depende de la categoría del chip: no se muestra.
  L1:  { core: Cortex-M3, target_cfg: target/stm32l1x.cfg, idcode_address: 0xE0042000, interface: stlink-dap }
  L4:  { core: Cortex-M4, target_cfg: target/stm32l4x.cfg, idcode_address: 0xE0042000, uid: 0x1FFF7590, interface: stlink-dap, dfu: true }
  L4+: { core: Cortex-M4, target_cfg: target/stm32l4plusx.cfg, idcode_address: 0xE0042000, uid: 0x1FFF7590, interface: stlink-dap, dfu: true }
  L5:  { core: Cortex-M33, target_cfg: target/stm32l5x.cfg, idcode_address: 0xE0044000, uid: 0x0BFA0590, interface: stlink-dap, dfu: true }
  U0:  { core: Cortex-M0+, target_cfg: target/stm32u0x.cfg, idcode_address: 0x40015800, interface: stlink-dap }
  U5:  { core: Cortex-M33, target_cfg: target/stm32u5x.cfg, idcode_address: 0xE0044000, uid: 0x0BFA0700, interface: stlink-dap, dfu: true }
  WB:  { core: Cortex-M4, target_cfg: target/stm32wbx.cfg, idcode_address: 0xE0042000, uid: 0x1FFF7580, interface: stlink-dap, dfu: true }
  WL:  { core: Cortex-M4, target_cfg: target/stm32wlx.cfg, idcode_address: 0xE0042000, uid: 0x1FFF7590, interface: stlink-dap }

