  # ======================= Arduino / AVR =======================
  - id: arduino-uno
    name: Arduino Uno (ATmega328P)
    family: AVR (ATmega328P, Optiboot)
    methods:
      avrdude: { part: atmega328p, programmer: arduino, baud: 115200, flash_kb: 32, bootloader_kb: 0.5 }

  - id: arduino-nano
    name: Arduino Nano (ATmega328P, bootloader nuevo)
    family: AVR (ATmega328P, Optiboot)
    methods:
