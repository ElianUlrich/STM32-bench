      esptool: { chip: esp32c2, baud: 460800 }

  - id: esp32-c3
    name: ESP32-C3 (DevKitM / SuperMini)
    family: ESP32-C3 (RISC-V)
    methods:
      esptool: { chip: esp32c3, baud: 460800 }

  - id: esp32-c5
    name: ESP32-C5
    family: ESP32-C5 (RISC-V, WiFi 5 GHz)
    methods:
      esptool: { chip: esp32c5, baud: 460800 }

  - id: esp32-c6
    name: ESP32-C6 (DevKitC)
    family: ESP32-C6 (RISC-V)
    methods:
      esptool: { chip: esp32c6, baud: 460800 }

  - id: esp32-c61
    name: ESP32-C61
    family: ESP32-C61 (RISC-V)
    methods:
      esptool: { chip: esp32c61, baud: 460800 }

  - id: esp32-h2
    name: ESP32-H2 (DevKitM)
    family: ESP32-H2 (RISC-V, Thread/Zigbee)
    methods:
      esptool: { chip: esp32h2, baud: 460800 }

  - id: esp32-p4
    name: ESP32-P4
    family: ESP32-P4 (RISC-V)
