  - id: arduino-leonardo
    name: Arduino Leonardo (ATmega32U4)
    family: AVR (ATmega32U4, Caterina, USB nativo)
    methods:
      avrdude: { part: atmega32u4, programmer: avr109, baud: 57600, flash_kb: 32, bootloader_kb: 4,
