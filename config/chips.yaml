  - id: arduino-mega2560
    name: Arduino Mega 2560 (ATmega2560)
    family: AVR (ATmega2560, stk500v2)
    methods:
      avrdude: { part: atmega2560, programmer: wiring, baud: 115200, flash_kb: 256, bootloader_kb: 8,
                 no_auto_erase: true }

  - id: arduino-mega1280
