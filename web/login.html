<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banco STM32 — Ingreso</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="login.js" defer></script>
</head>
<body class="login-body">
  <form class="login-card" id="login-form">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 2v4M12 2v4M15 2v4M9 18v4M12 18v4M15 18v4M2 9h4M2 12h4M2 15h4M18 9h4M18 12h4M18 15h4"/></svg>
      <span>Banco STM32</span>
    </div>
    <label class="field"><span>Usuario</span><input id="username" autocomplete="username" required autofocus></label>
    <label class="field"><span>Contraseña</span><input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary wide" type="submit">Ingresar</button>
    <p id="login-error" class="note error-text" hidden></p>
    <p class="note muted">Acceso solo a través de Tailscale.</p>
  </form>
</body>
</html>
